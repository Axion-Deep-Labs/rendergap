name: "rendergap"
description: "Fail the build when crawlers get less than visitors: content that needs JavaScript, thinner HTML for bots, or blocked crawler user agents."
author: "Axion Deep Labs"
branding:
  icon: "eye"
  color: "orange"

inputs:
  urls:
    description: "One URL per line. Usually a preview or staging deployment."
    required: true
  check:
    description: "gap (raw HTML vs rendered), crawlers (who can reach it), or both"
    required: false
    default: "gap"
  agent:
    description: "Crawler whose raw fetch to compare in the gap check"
    required: false
    default: "gptbot"
  fail-on:
    description: "Gap check: critical, warning, info or never"
    required: false
    default: "critical"
  fail-on-blocked:
    description: "Crawler check: fail when any crawler is blocked (true or false)"
    required: false
    default: "false"
  viewport:
    description: "desktop or mobile for the rendered side of the gap check"
    required: false
    default: "desktop"
  headers:
    description: "Extra request headers, one 'Name: value' per line (for example a preview bypass token from secrets)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install rendergap
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if [ -x /usr/bin/google-chrome ]; then export PUPPETEER_SKIP_DOWNLOAD=1; fi
        npm ci --omit=dev --no-audit --no-fund
    - name: Run rendergap
      shell: bash
      env:
        RG_URLS: ${{ inputs.urls }}
        RG_CHECK: ${{ inputs.check }}
        RG_AGENT: ${{ inputs.agent }}
        RG_FAIL_ON: ${{ inputs.fail-on }}
        RG_FAIL_BLOCKED: ${{ inputs.fail-on-blocked }}
        RG_VIEWPORT: ${{ inputs.viewport }}
        RG_HEADERS: ${{ inputs.headers }}
        RG_BIN: ${{ github.action_path }}/bin/rendergap.js
      run: |
        if [ -x /usr/bin/google-chrome ]; then export CHROME_PATH=/usr/bin/google-chrome; fi
        export NO_COLOR=1
        trim() { local s="$1"; s="${s#"${s%%[![:space:]]*}"}"; s="${s%"${s##*[![:space:]]}"}"; printf '%s' "$s"; }
        hdr=()
        while IFS= read -r h; do
          h="$(trim "$h")"; [ -n "$h" ] && hdr+=(--header "$h")
        done <<< "$RG_HEADERS"
        summary() { { echo "<details open><summary>$1</summary>"; echo; echo '````text'; echo "$2"; echo '````'; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"; }
        status=0
        while IFS= read -r url; do
          url="$(trim "$url")"
          [ -z "$url" ] && continue
          if [ "$RG_CHECK" = "gap" ] || [ "$RG_CHECK" = "both" ]; then
            code=0; out="$(node "$RG_BIN" "$url" --agent "$RG_AGENT" --fail-on "$RG_FAIL_ON" --viewport "$RG_VIEWPORT" "${hdr[@]}" 2>&1)" || code=$?
            echo "$out"; summary "render gap: $url" "$out"
            if [ "$code" -ne 0 ]; then status=1; fi
          fi
          if [ "$RG_CHECK" = "crawlers" ] || [ "$RG_CHECK" = "both" ]; then
            flag="never"; [ "$RG_FAIL_BLOCKED" = "true" ] && flag="blocked"
            code=0; out="$(node "$RG_BIN" crawlers "$url" --fail-on "$flag" "${hdr[@]}" 2>&1)" || code=$?
            echo "$out"; summary "crawler access: $url" "$out"
            if [ "$code" -ne 0 ]; then status=1; fi
          fi
        done <<< "$RG_URLS"
        exit $status
